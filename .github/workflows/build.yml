name: Build and verify (reproduce.sh)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    # Pin OS : ubuntu-latest drifts over time ; reproducibility requires a fixed image
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # Pin elan install source to a specific release tag rather than `master`
      # (H6 mitigation : supply-chain risk from curl | sh on master branch).
      # elan v4.1.2 matches the developer baseline recorded in env-snapshots.
      - name: Install elan 4.1.2
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/elan-init.sh \
              "https://raw.githubusercontent.com/leanprover/elan/v4.1.2/elan-init.sh"
          # Basic integrity assertion (non-empty ; the referenced version tag itself is the anchor)
          test -s /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Show Lean toolchain pin
        run: |
          cat lean-toolchain
          lake --version

      # Dedicated cache-get step : hard-fail if unavailable to prevent silent
      # 1h+ source builds hitting the job timeout (H3 mitigation).
      - name: Fetch Mathlib olean cache
        run: lake exe cache get

      # Full end-to-end verification : build, axiom probe, sorry probe.
      # reproduce.sh exit codes :
      #   0 success, 1 toolchain, 2 build, 3 axiom drift, 4 sorryAx
      - name: Run reproduce.sh
        run: bash reproduce.sh

      # Upload /tmp logs on failure for post-mortem (LOW improvement from RT)
      - name: Upload verification logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reproduce-logs
          path: |
            /tmp/nocycle_build.log
            /tmp/nocycle_axioms.log
            /tmp/nocycle_sorry.log
            /tmp/nocycle_cache.log
          if-no-files-found: ignore
